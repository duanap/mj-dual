<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122e29">
<title>双人麻将 · 两杠起胡</title>
<style>
  :root {
    --t-lg: 50px; --t-md: 44px; --t-sm: 28px; --t-xs: 23px;
    --gold: #e6c77c; --ink: #eef5ef; --muted: #a5beb3; --accent: #a9ddba; --game-height: 100dvh;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #0f2420; color: var(--ink); -webkit-tap-highlight-color: transparent; user-select: none; overflow: hidden; }
  button, input { font: inherit; }
  button { touch-action: manipulation; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  #app { position: relative; width: 100%; height: var(--game-height); max-width: 1240px; margin: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  .topbar { display: flex; gap: 8px; align-items: center; min-height: 36px; }
  .brand { font-size: 17px; font-weight: 750; letter-spacing: 2px; margin-right: 8px; white-space: nowrap; }
  .stat { font-size: 12px; padding: 5px 9px; white-space: nowrap; color: var(--muted); }
  .stat.mode { background: #24463c; border-radius: 6px; color: var(--accent); }
  .stat.score { color: var(--gold); }
  .stat.online b { color: #bbdeff; letter-spacing: 2px; }
  .spacer { flex: 1; }
  .ghost { min-height: 34px; min-width: 38px; padding: 6px 10px; background: #ffffff09; border: 1px solid #ffffff22; color: var(--ink); border-radius: 7px; font-size: 12px; white-space: nowrap; }
  .ghost:hover { background: #ffffff16; }
  .table { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 18px 24px 10px; border: 3px solid #50604b; border-bottom-color: #344738; border-radius: 20px; background: radial-gradient(ellipse at 50% 30%, #305e50, #244b40 70%, #204138); box-shadow: 0 14px 36px #0003, inset 0 1px 0 #ffffff0d; overflow: hidden; }
  .zone { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex-shrink: 0; }
  .zone.me { margin-top: auto; }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; min-height: 26px; }
  .plate { display: inline-flex; align-items: center; gap: 6px; background: #142e2780; padding: 5px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
  .plate em { font-style: normal; font-size: 10px; color: var(--gold); }
  .pdot { width: 6px; height: 6px; background: #9db0a6; border-radius: 50%; }
  .zone.turn .pdot { background: var(--accent); box-shadow: 0 0 0 3px #a9ddba22; }
  .zone.turn .plate { box-shadow: inset 3px 0 0 var(--accent); }
  .fchip { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; font-size: 11px; font-style: normal; }
  .fchip.tong { background: #dce8f5; color: #244c87; }
  .fchip.tiao { background: #dcecdf; color: #227557; }
  .fchip.none { color: var(--muted); }
  .gang-progress { font-size: 11px; color: #c2d8cc; }
  .melds { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .meld { display: inline-flex; align-items: flex-end; gap: 2px; }
  .meld i { font-size: 10px; color: var(--muted); font-style: normal; margin: 0 4px; align-self: center; }
  .backs { display: flex; gap: 3px; align-items: center; justify-content: center; min-height: 44px; }
  .center { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; container-type: size; }
  .discard-field { --t-sm: clamp(12px, calc((100cqh - 92px) / 2.8), 28px); height: 100%; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; max-width: calc(100% - 340px); }
  .discard-side { display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 0; }
  .river-label { font-size: 10px; color: #b4cbbe; letter-spacing: 1px; white-space: nowrap; }
  .discard-side .river { grid-template-columns: repeat(6, calc(var(--t-sm) + 8px)); overflow-y: auto; overflow-x: hidden; min-height: 0; scrollbar-width: thin; padding: 3px; }
  .opp-discard .river .tface { transform: rotate(180deg); }
  .river { display: grid; grid-template-columns: repeat(6, max-content); gap: 3px; width: max-content; max-width: 100%; margin: auto; }
  .river:empty::before { content: "暂无出牌"; grid-column: 1 / -1; color: #9bb5a7; font-size: 11px; padding: 2px 0; text-align: center; }
  .table-status { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 160px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; }
  .hint { width: 100%; font-size: 13px; line-height: 1.6; text-align: center; color: #d0e4d7; }
  .wall-disc { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 48px; padding: 9px 12px; border-radius: 9px; background: #173c32; }
  .wall-disc b { font-size: 22px; color: var(--accent); font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .wall-disc span { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .tface { display: inline-flex; vertical-align: bottom; flex: none; padding: 3px; background: #fffdf7; border: 1px solid #d7ded0; border-bottom: 3px solid #c1ccbc; border-radius: 6px; box-shadow: 0 2px 3px #071d2430; }
  .tface svg { display: block; }
  .t-lg svg { width: var(--t-lg); height: calc(var(--t-lg) * 1.4); }
  .t-md svg { width: var(--t-md); height: calc(var(--t-md) * 1.4); }
  .t-sm svg { width: var(--t-sm); height: calc(var(--t-sm) * 1.4); }
  .t-xs svg { width: var(--t-xs); height: calc(var(--t-xs) * 1.4); }
  .t-sm .tile-detail, .t-xs .tile-detail { display: none; }
  .tface.back { background: #578779; border-color: #80a697; border-bottom-color: #37675b; position: relative; box-shadow: 0 2px 3px #0002; }
  .tface.back::after { content: ""; position: absolute; inset: 5px; border: 1px solid #b3d0bf66; border-radius: 3px; }
  .back.t-sm { width: calc(var(--t-sm) + 8px); height: calc(var(--t-sm) * 1.4 + 10px); }
  .back.t-xs { width: calc(var(--t-xs) + 8px); height: calc(var(--t-xs) * 1.4 + 10px); }
  .tface.drawn { border-bottom-color: #7aa88b; }
  .tface.latest { box-shadow: 0 0 0 2px var(--gold); }
  .tface.last { box-shadow: 0 0 0 2px #9fc4af, 0 5px 10px #0002; }
  .hand-area { container-type: inline-size; width: 100%; }
  .hand { --t-lg: clamp(18px, calc((100cqw - 14px - (var(--hand-count) - 1) * 3px) / var(--hand-count) - 8px), 50px); display: flex; flex-wrap: nowrap; gap: 3px; justify-content: center; align-items: flex-end; padding-top: 14px; padding-bottom: 2px; }
  .drawn-slot { margin-left: 14px; }
  .tbtn { padding: 0; border: 0; background: transparent; border-radius: 6px; flex: none; }
  .tbtn .tface { transition: transform .15s ease, box-shadow .15s ease; }
  .tface.selected { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--accent), 0 7px 12px #0003; }
  @media (hover: hover) { .tbtn:hover .tface:not(.selected) { transform: translateY(-4px); } }
  .tbtn:active .tface { transform: translateY(-6px); }
  .actionbar { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
  .action-note { color: #b0c6b9; font-size: 11px; }
  .abtn { min-height: 40px; padding: 9px 24px; font-size: 15px; font-weight: 650; border-radius: 8px; border: 1px solid #ffffff18; color: #fff; background: #486a5f; white-space: nowrap; }
  .abtn:active { transform: translateY(1px); }
  .abtn.hu { background: #bd4a42; }
  .abtn.gang { background: #8d712e; }
  .abtn.peng { background: #355f90; }
  .abtn.pass { background: #48665c; }
  .abtn.choose_flower { background: #326c56; }
  #toast { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); background: #102a25f5; border: 1px solid #ffffff30; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 60; max-width: 90%; pointer-events: none; animation: toastfade 3.2s forwards; }
  @keyframes toastfade { 0%, 75% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
  #logpanel { position: absolute; right: 24px; top: 64px; width: 280px; max-height: 65%; overflow-y: auto; background: #102a25f5; border: 1px solid #ffffff25; border-radius: 9px; padding: 12px; font-size: 12px; line-height: 1.9; z-index: 30; }
  #logpanel.hidden { display: none; }
  .overlay { position: absolute; inset: 0; padding: 16px; background: #081c17b8; display: flex; align-items: center; justify-content: center; z-index: 50; }
  .card { background: #f8fbf6; color: #253f33; border-radius: 16px; padding: 24px; width: min(560px, 100%); max-height: calc(var(--game-height) - 32px); overflow: auto; text-align: center; box-shadow: 0 16px 48px #0004; }
  .card h2 { font-size: 24px; margin: 0 0 12px; font-weight: 700; }
  .card p { font-size: 14px; margin: 8px 0; }
  .card .dim { color: #607267; font-size: 13px; }
  .card .ghost { color: #355447; border-color: #c5d3c8; }
  .card .rev { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; text-align: left; margin: 12px 0; }
  .card .rev b { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; margin-right: 5px; }
  .card .tally { color: #607267; font-size: 13px; }
  .card .tally b { color: #326c56; font-size: 17px; }
  .card > .abtn { margin-top: 10px; }
  .joinrow { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .joinrow input { min-width: 0; width: 150px; padding: 8px 12px; text-align: center; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; background: #fff; border: 1px solid #c5d3c8; border-radius: 8px; color: #253f33; }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .dialog-head h2 { margin: 0; font-size: 20px; }
  .river-card { width: min(680px, 100%); text-align: left; }
  .river-history h3 { font-size: 12px; font-weight: 600; color: #607267; margin: 16px 0 10px; }
  .river.full { grid-template-columns: repeat(auto-fit, minmax(36px, max-content)); width: 100%; max-height: none; overflow: visible; justify-content: start; }
  .river.full .tface { justify-content: center; }
  .river-card .river:empty::before { color: #607267; }
  @media (orientation: landscape) and (max-height: 560px), (orientation: portrait) and (max-width: 620px) {
    :root { --t-md: 30px; --t-sm: 20px; --t-xs: 17px; }
    #app { padding: max(4px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); gap: 5px; }
    .topbar { gap: 3px; min-height: 28px; }
    .brand { font-size: 13px; letter-spacing: 1px; margin-right: 4px; }
    .stat { font-size: 10px; padding: 3px 6px; }
    .ghost { min-height: 28px; min-width: 32px; padding: 4px 7px; font-size: 10px; }
    .table { padding: 6px 12px 3px; gap: 4px; border-radius: 12px; border-width: 2px; }
    .zone { gap: 3px; }
    .meta { min-height: 20px; gap: 7px; }
    .plate { padding: 2px 7px; font-size: 10px; }
    .fchip { width: 15px; height: 15px; font-size: 10px; }
    .gang-progress { font-size: 10px; }
    .melds { gap: 4px; }
    .meld i { font-size: 9px; }
    .backs { --t-sm: 14px; min-height: 0; gap: 2px; }
    .center { min-height: 104px; }
    .discard-field { --t-sm: clamp(12px, calc((100cqh - 71px) / 2.8), 20px); height: auto; max-height: 100%; max-width: calc(100% - 260px); gap: 8px; }
    .discard-side { gap: 3px; }
    .river-label { font-size: 9px; letter-spacing: 0; }
    .river { gap: 2px; }
    .table-status { left: 4px; width: 120px; gap: 7px; }
    .hint { font-size: 11px; line-height: 1.4; }
    .wall-disc { min-width: 38px; padding: 5px 8px; }
    .wall-disc b { font-size: 17px; }
    .wall-disc span { font-size: 9px; margin-top: 1px; }
    .hand { --t-lg: clamp(18px, calc((100cqw - 14px - (var(--hand-count) - 1) * 3px) / var(--hand-count) - 8px), 40px); padding-top: 11px; }
    .tface.selected { transform: translateY(-8px); }
    .actionbar { min-height: 36px; padding-top: 2px; gap: 8px; }
    .abtn { min-height: 32px; padding: 6px 18px; font-size: 13px; }
    .action-note { font-size: 10px; }
    #logpanel { top: 38px; right: 8px; max-height: 65%; }
    #toast { top: 38px; font-size: 12px; padding: 7px 12px; }
    .card { padding: 16px 20px; }
    .card h2 { font-size: 21px; }
    .river-card { --t-sm: 28px; }
  }
  @media (orientation: landscape) and (max-width: 720px), (orientation: portrait) and (max-width: 620px) and (max-height: 720px) {
    .brand, .stat.mode { display: none; }
    .table { padding-left: 8px; padding-right: 8px; }
  }
  @media (orientation: landscape) and (max-height: 360px), (orientation: portrait) and (max-width: 360px) {
    :root { --t-sm: 16px; --t-md: 25px; --t-xs: 10px; }
    .hand { --t-lg: clamp(18px, calc((100cqw - 14px - (var(--hand-count) - 1) * 3px) / var(--hand-count) - 8px), 28px); }
    .backs { --t-sm: 12px; }
    .center { min-height: 90px; }
    .discard-field { --t-sm: clamp(10px, calc((100cqh - 64px) / 2.8), 16px); gap: 4px; }
    .river-label { font-size: 8px; line-height: 10px; }
  }
  @media (orientation: portrait) {
    :root { --game-height: 100dvw; }
    #app { position: absolute; left: 50%; top: 50%; width: 100dvh; max-width: none; margin: 0; transform: translate(-50%, -50%) rotate(90deg); }
  }
  @media (orientation: portrait) and (max-width: 620px) {
    /* Clockwise rotation maps physical top/bottom to logical left/right. */
    #app { padding: max(4px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-top)); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
