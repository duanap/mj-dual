<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>两人两杠起胡麻将 · 人机对战</title>
<style>
  /* ---------- 设计令牌：牌面尺寸随布局切换 ---------- */
  :root {
    --t-lg: 42px; --t-md: 34px; --t-sm: 26px; --t-xs: 18px;
    --gold: #ffd75e;
    --felt-hi: #3a8457; --felt: #276b44; --felt-lo: #17442b;
    --wood: #5e3a1c; --wood-lo: #3d2410;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif;
    background: #0e1f16; color: #eef3ee;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #app { height: 100dvh; max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; padding: 10px 14px 8px; gap: 8px; }

  /* ---------- 顶栏 ---------- */
  .topbar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,.09); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
  .stat.score { color: var(--gold); }
  .stat.online b { color: #7fd4ff; letter-spacing: 2px; }
  #toast {
    position: fixed; top: 46px; left: 50%; transform: translateX(-50%);
    background: rgba(8,20,14,.92); border: 1px solid rgba(255,255,255,.25);
    padding: 7px 16px; border-radius: 999px; font-size: 13px; z-index: 60;
    animation: pop .2s ease-out, toastfade 3.2s forwards; max-width: 80vw; pointer-events: none;
  }
  @keyframes toastfade { 0%, 75% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
  .joinrow { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .joinrow input {
    width: 130px; text-align: center; font-size: 20px; letter-spacing: 6px; text-transform: uppercase;
    padding: 8px 10px; border-radius: 10px; border: 1px solid #b9ac8a; background: #fffdf4; color: #333;
  }
  .card .dim { color: #888; font-size: 12.5px; }
  .spacer { flex: 1; }
  .ghost {
    min-width: 34px; height: 30px; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.22); color: #dfe8df; border-radius: 8px;
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  .ghost:hover { background: rgba(255,255,255,.14); }

  /* ---------- 牌桌 ---------- */
  .table {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px;
    background:
      radial-gradient(120% 95% at 50% 38%, var(--felt-hi), var(--felt) 55%, var(--felt-lo)),
      repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px);
    border: 8px solid var(--wood); border-bottom-color: var(--wood-lo); border-right-color: var(--wood-lo);
    border-radius: 18px; padding: 8px 14px; overflow: hidden;
    box-shadow: inset 0 0 46px rgba(0,0,0,.5), 0 6px 24px rgba(0,0,0,.4);
  }
  .zone { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .zone.me { margin-top: auto; }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .plate {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,.32); padding: 3px 11px; border-radius: 999px;
    font-size: 12.5px; transition: box-shadow .25s; white-space: nowrap;
  }
  .plate em { font-style: normal; color: #ff9c5b; font-weight: 700; }
  .pdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .zone.me .pdot { background: var(--gold); box-shadow: 0 0 6px rgba(255,215,94,.8); }
  .zone.opp .pdot { background: #ff8a7a; box-shadow: 0 0 6px rgba(255,138,122,.7); }
  .zone.turn .plate { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(255,215,94,.55); }
  .fchip {
    display: inline-flex; width: 17px; height: 17px; border-radius: 4px; align-items: center; justify-content: center;
    font-size: 10.5px; font-style: normal; color: #fff;
  }
  .fchip.tong { background: #1e5aa8; }
  .fchip.tiao { background: #1c7a3a; }
  .fchip.none { background: #556; }

  .melds { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .meld { display: inline-flex; align-items: flex-end; gap: 1px; background: rgba(255,255,255,.10); border-radius: 6px; padding: 2px 4px; }
  .meld i { font-style: normal; font-size: 10px; color: #ffe9a8; margin-left: 3px; align-self: center; }

  .tray {
    background: rgba(0,0,0,.22); border-radius: 8px; padding: 3px 6px;
    box-shadow: inset 0 1px 5px rgba(0,0,0,.35);
  }
  .river { display: flex; flex-wrap: wrap; gap: 2px; align-content: flex-start; }
  .river:empty::before { content: "牌河"; font-size: 11px; color: rgba(255,255,255,.35); align-self: center; }
  .backs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }

  .center { display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 50px; margin-top: auto; }
  .mid { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .hint { font-size: 14.5px; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
  .wall-disc {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 54px; height: 54px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.16), rgba(0,0,0,.28));
    box-shadow: inset 0 2px 5px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.08);
  }
  .wall-disc b { font-size: 18px; color: var(--gold); line-height: 1.1; }
  .wall-disc span { font-size: 10px; color: rgba(255,255,255,.75); }

  /* ---------- 操作按钮 ---------- */
  .actionbar { min-height: 54px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .abtn {
    font-size: 16.5px; font-weight: 700; letter-spacing: 2px; padding: 10px 26px;
    border-radius: 12px; border: 1px solid rgba(0,0,0,.28); cursor: pointer; color: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.35);
    animation: pop .18s ease-out; touch-action: manipulation;
  }
  .abtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.32); }
  .abtn.hu { background: linear-gradient(180deg, #e8574a, #bf3226); animation: pulse 1.1s infinite; }
  .abtn.gang { background: linear-gradient(180deg, #d29a22, #a1730e); }
  .abtn.peng { background: linear-gradient(180deg, #2f6cc3, #1c4f95); }
  .abtn.pass { background: linear-gradient(180deg, #5c6e66, #46564f); }
  .abtn.choose_flower { background: linear-gradient(180deg, #8a5bb0, #6a4389); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  @keyframes pulse { 50% { transform: translateY(-3px); box-shadow: 0 7px 16px rgba(211,56,44,.5), inset 0 1px 0 rgba(255,255,255,.35); } }

  /* ---------- 牌面 ---------- */
  .tface {
    display: inline-flex; background: linear-gradient(180deg, #fffdf4, #ece2c6);
    border: 1px solid #b9ac8a; border-bottom: 3px solid #a3977a; border-radius: 5px;
    padding: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 0 4px rgba(255,255,255,.8);
  }
  .tface svg { display: block; }
  .t-lg svg { width: var(--t-lg); height: calc(var(--t-lg) * 1.4); }
  .t-md svg { width: var(--t-md); height: calc(var(--t-md) * 1.4); }
  .t-sm svg { width: var(--t-sm); height: calc(var(--t-sm) * 1.4); }
  .t-xs svg { width: var(--t-xs); height: calc(var(--t-xs) * 1.4); }
  .tface.drawn { outline: 2px solid #ffb02e; outline-offset: -2px; }
  .hand .drawn { margin-left: 10px; }
  .tface.latest { outline: 2px solid var(--gold); outline-offset: -2px; }
  .tface.last { animation: drop .22s ease-out; box-shadow: 0 0 0 3px var(--gold), 0 4px 12px rgba(0,0,0,.45); }
  @keyframes drop { from { transform: translateY(-16px) scale(1.2); opacity: 0; } }
  .tface.back { background: linear-gradient(135deg, #35558c, #24406e); border-color: #1b2f52; border-bottom: 3px solid #16294a; box-shadow: none; }
  .back.t-sm { width: calc(var(--t-sm) + 4px); height: calc(var(--t-sm) * 1.4 + 4px); }
  .back.t-xs { width: calc(var(--t-xs) + 4px); height: calc(var(--t-xs) * 1.4 + 4px); }
  .hand { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; min-height: calc(var(--t-lg) * 1.4 + 10px); }
  .tbtn { padding: 0; border: none; background: transparent; cursor: pointer; touch-action: manipulation; }
  .tbtn .tface { transition: transform .12s; }
  .tbtn:hover .tface { transform: translateY(-8px); }
  .tbtn:active .tface { transform: translateY(-2px) scale(.97); }
  .hand.dealing > * { animation: dealin .3s backwards; }
  @keyframes dealin { from { transform: translateY(14px) rotate(4deg); opacity: 0; } }

  /* ---------- 记录面板 / 结算 ---------- */
  #logpanel {
    position: fixed; right: 12px; top: 52px; width: 280px; max-height: 62vh; overflow-y: auto;
    background: rgba(8,20,14,.95); border: 1px solid rgba(255,255,255,.2); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.8; z-index: 30;
  }
  #logpanel.hidden { display: none; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center;
    justify-content: center; z-index: 50; animation: fade .2s; backdrop-filter: blur(2px);
  }
  .card {
    background: linear-gradient(180deg, #fffef8, #f4ecd8); color: #333; border-radius: 16px;
    padding: 20px 28px; max-width: 560px; width: calc(100% - 40px); text-align: center;
    box-shadow: 0 14px 50px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.06);
    animation: pop .22s ease-out;
  }
  .card h2 { margin: 4px 0 6px; font-size: 27px; letter-spacing: 5px; color: #1d3a2a; }
  .card p { margin: 4px 0; font-size: 14px; }
  .card .rev { text-align: left; margin: 9px 0; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
  .card .rev b { margin-right: 6px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
  .card .tally { font-size: 13.5px; color: #666; }
  .card .tally b { color: #b8860b; font-size: 16px; }
  .card .abtn { margin-top: 10px; }
  @keyframes fade { from { opacity: 0; } }

  /* ============================================================
     手机横屏（沉浸紧凑布局）：矮视口优先，牌更大、信息更密
     ============================================================ */
  @media (orientation: landscape) and (max-height: 560px) {
    :root { --t-lg: 47px; --t-md: 27px; --t-sm: 19px; --t-xs: 14px; }
    #app { padding: 4px 8px 3px; gap: 4px; }
    .topbar { gap: 5px; }
    .stat { font-size: 11.5px; padding: 2px 9px; }
    .ghost { min-width: 30px; height: 26px; font-size: 12.5px; }
    .table { padding: 4px 10px; gap: 3px; border-width: 6px; border-radius: 12px; }
    .zone { gap: 2px; }
    .plate { font-size: 11px; padding: 2px 8px; }
    .fchip { width: 14px; height: 14px; font-size: 9px; }
    .melds { gap: 4px; }
    .tray { padding: 2px 4px; }
    .river { max-height: calc(var(--t-sm) * 1.4 * 2 + 6px); overflow: hidden; }
    .backs { min-height: 0; }
    .hand { min-height: calc(var(--t-lg) * 1.4 + 12px); }
    .center { min-height: 42px; gap: 14px; }
    .wall-disc { width: 42px; height: 42px; }
    .wall-disc b { font-size: 15px; }
    .wall-disc span { font-size: 9px; }
    .hint { font-size: 13px; }
    .actionbar { min-height: 48px; gap: 10px; }
    .abtn { font-size: 15px; padding: 8px 20px; letter-spacing: 1px; }
    #logpanel { top: 34px; right: 8px; max-height: 52vh; width: 240px; font-size: 11.5px; }
    .card { padding: 12px 20px; max-width: 480px; }
    .card h2 { font-size: 21px; margin: 0 0 2px; }
  }
  @media (orientation: landscape) and (max-height: 400px) {
    :root { --t-md: 23px; --t-sm: 17px; --t-xs: 12px; }
    .river { max-height: calc(var(--t-sm) * 1.4 * 2 + 4px); }
  }

  /* ---------- 手机竖屏：提示旋转 ---------- */
  .rotate-hint {
    display: none; position: fixed; inset: 0; z-index: 100; background: #0e1f16;
    color: #eef3ee; align-items: center; justify-content: center; text-align: center;
    font-size: 22px; line-height: 2;
  }
  .rotate-hint small { display: block; font-size: 13px; color: rgba(255,255,255,.55); }
  @media (orientation: portrait) and (max-width: 620px) {
    .rotate-hint { display: flex; }
    #app { visibility: hidden; }
  }

  /* ---------- 窄桌面微缩 ---------- */
  @media (max-width: 760px) and (orientation: portrait) { /* 竖屏提示已覆盖 */ }
  @media (max-width: 760px) and (orientation: landscape) { /* 由上面横屏块接管 */ }
</style>
</head>
<body>
<div id="app"></div>
<div class="rotate-hint"><div>🔄<br>请横屏游玩<small>转动手机，获得完整牌桌体验</small></div></div>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
